<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Card -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bagGrad)" />
  
  <!-- Shopping Bag Handles -->
  <path d="M 38 34 A 12 12 0 0 1 62 34" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
  
  <!-- Shopping Bag Body -->
  <path d="M 26 34 L 74 34 Q 76 34 75 38 L 70 78 Q 69 82 64 82 L 36 82 Q 31 82 30 78 L 25 38 Q 24 34 26 34 Z" fill="#ffffff" opacity="0.96" />
  
  <!-- Star Emblem on Bag -->
  <path d="M 50 46 L 53 53 L 60 54 L 55 59 L 56 66 L 50 62 L 44 66 L 45 59 L 40 54 L 47 53 Z" fill="url(#starGrad)" filter="url(#glow)"/>
</svg>